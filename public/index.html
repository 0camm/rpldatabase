<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPL Database</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:      #e8001d;
    --red-dim:  rgba(232,0,29,.12);
    --bg:       #07070c;
    --surface:  #0f0f16;
    --surface2: #161620;
    --surface3: #1c1c28;
    --border:   rgba(255,255,255,.08);
    --border2:  rgba(255,255,255,.04);
    --muted:    #56566a;
    --muted2:   #3a3a4e;
    --text:     #e0e0f0;
    --green:    #22c55e;
    --green-dim:rgba(34,197,94,.12);
    --amber:    #f59e0b;
    --amber-dim:rgba(245,158,11,.12);
    --blue:     #60a5fa;
    --blue-dim: rgba(96,165,250,.12);
    --win:      #4ade80;
    --lose:     #f87171;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: sticky; top:0; z-index:100;
    height: 52px;
    display: flex; align-items:center; justify-content:space-between;
    padding: 0 20px;
    background: rgba(7,7,12,.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .nav-left { display:flex; align-items:center; gap:12px; }

  .nav-logo {
    width:28px; height:28px; border-radius:6px;
    background: var(--red);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif; font-size:15px; color:#fff;
    letter-spacing:.02em; flex-shrink:0;
  }

  .nav-title {
    font-family:'Bebas Neue',sans-serif;
    font-size:17px; letter-spacing:.08em; color:#fff;
  }
  .nav-title em { color:var(--red); font-style:normal; }

  .nav-pill {
    font-size:10px; font-weight:600; letter-spacing:.08em;
    color:var(--muted); text-transform:uppercase;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius:20px; padding:3px 9px;
    display:none;
  }
  @media (min-width:480px) { .nav-pill { display:block; } }

  .nav-right { display:flex; align-items:center; gap:12px; }

  .sync-label { font-size:11px; color:var(--muted); display:none; }
  @media (min-width:600px) { .sync-label { display:block; } }

  .live-pill {
    display:flex; align-items:center; gap:5px;
    font-size:10px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);
  }
  .live-pill.live { color:var(--green); }
  .live-dot {
    width:6px; height:6px; border-radius:50%; background:var(--muted); flex-shrink:0;
  }
  .live-pill.live .live-dot { background:var(--green); animation:pulse 1.8s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.6)} }

  .admin-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); cursor: pointer;
    transition: border-color .2s, color .2s;
    white-space: nowrap;
  }
  .admin-btn:hover { border-color: rgba(232,0,29,.4); color: var(--text); }

  /* ── PAGE ── */
  .page { max-width:1340px; margin:0 auto; padding:0 16px 80px; }

  /* ── HERO ── */
  .hero {
    padding: 24px 0 20px;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px;
    border-bottom: 1px solid var(--border2);
    margin-bottom:20px;
    flex-wrap:wrap;
  }

  .hero-title {
    font-family:'Bebas Neue',sans-serif;
    font-size:28px; letter-spacing:.04em; color:#fff; line-height:1;
  }
  .hero-title em { color:var(--red); font-style:normal; }
  .hero-sub { font-size:11px; color:var(--muted); margin-top:5px; letter-spacing:.02em; }

  /* ── SEARCH ── */
  .search-wrap { position:relative; width:240px; flex-shrink:0; }

  .search-icon {
    position:absolute; left:11px; top:50%;
    transform:translateY(-50%); pointer-events:none;
    color:var(--muted);
  }

  .search-input {
    width:100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px 9px 34px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 12px; outline:none;
    transition: border-color .2s;
  }
  .search-input::placeholder { color:var(--muted); }
  .search-input:focus { border-color: rgba(232,0,29,.35); }

  /* ── TABS ── */
  .tabs {
    display:flex; gap:2px; margin-bottom:20px;
    border-bottom: 1px solid var(--border);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar { display:none; }

  .tab {
    background:none; border:none;
    border-bottom: 2px solid transparent;
    padding: 10px 18px; margin-bottom:-1px;
    font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); cursor:pointer;
    transition: color .2s, border-color .2s;
    white-space:nowrap; flex-shrink:0;
  }
  .tab:hover { color:var(--text); }
  .tab.active { color:#fff; border-bottom-color:var(--red); }

  /* ── VIEWS ── */
  .view { display:none; }
  .view.active { display:block; }

  /* ── LEADERBOARD GRID ── */
  .lb-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap:16px;
    margin-bottom:40px;
  }

  /* Leaderboard table box */
  .lb-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
  }

  .lb-table-header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .lb-table-title-wrap { display:flex; align-items:center; gap:8px; }

  .lb-strip {
    width:3px; height:16px; border-radius:2px;
    background: var(--red); flex-shrink:0;
  }

  .lb-table-title {
    font-family:'Bebas Neue',sans-serif;
    font-size:16px; letter-spacing:.06em; color:#fff;
  }

  .lb-table-stat {
    font-size:10px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--red);
    background: var(--red-dim);
    border: 1px solid rgba(232,0,29,.2);
    padding: 2px 7px; border-radius:4px;
  }

  .lb-col-headers {
    display:grid;
    grid-template-columns: 26px 1fr 48px 72px;
    padding: 7px 16px;
    border-bottom: 1px solid var(--border2);
  }
  .lb-col-headers span {
    font-size:10px; font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);
  }
  .lb-col-headers span:not(:first-child):not(:nth-child(2)) { text-align:center; }

  .lb-row {
    display:grid;
    grid-template-columns: 26px 1fr 48px 72px;
    padding: 9px 16px;
    border-bottom: 1px solid var(--border2);
    align-items:center;
    transition: background .14s;
    position:relative;
  }
  .lb-row:last-child { border-bottom:none; }
  .lb-row:hover { background:rgba(255,255,255,.022); }

  .lb-row.top {
    background: rgba(232,0,29,.05);
  }
  .lb-row.top:hover { background:rgba(232,0,29,.09); }
  .lb-row.top::before {
    content:''; position:absolute;
    left:0; top:0; bottom:0; width:3px;
    background: var(--red);
  }

  .lb-rank {
    font-family:'Bebas Neue',sans-serif;
    font-size:15px; letter-spacing:.04em; color:var(--muted);
  }
  .lb-rank.gold   { color:#f59e0b; }
  .lb-rank.silver { color:#94a3b8; }
  .lb-rank.bronze { color:#b45309; }

  .lb-name {
    font-size:12px; font-weight:600; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lb-name.search-match { color:var(--red); }

  .lb-gp { text-align:center; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }

  .lb-val {
    font-family:'Bebas Neue',sans-serif;
    font-size:17px; color:#fff;
    letter-spacing:.04em; text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .lb-row.top .lb-val { color:var(--red); }

  /* ── PLAYER CARDS ── */
  .player-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap:14px;
  }

  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    transition: border-color .2s;
  }
  .player-card:hover { border-color: rgba(232,0,29,.25); }

  .player-card-header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    position:relative;
  }
  .player-card-header::before {
    content:''; position:absolute;
    left:0; top:0; bottom:0; width:3px;
    background: var(--red);
  }

  .player-card-name {
    font-family:'Bebas Neue',sans-serif;
    font-size:19px; letter-spacing:.06em; color:#fff;
  }

  .player-card-gp {
    font-size:10px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);
    background: var(--surface3);
    border: 1px solid var(--border);
    padding: 2px 7px; border-radius:4px;
  }

  .player-stat-grid {
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:1px;
    background: var(--border2);
  }

  .player-stat-cell {
    background: var(--surface);
    padding: 11px 10px;
    text-align:center;
  }

  .player-stat-label {
    font-size:9px; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
    margin-bottom:3px;
  }

  .player-stat-val {
    font-family:'Bebas Neue',sans-serif;
    font-size:20px; letter-spacing:.04em; color:#fff;
    font-variant-numeric:tabular-nums;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align:center; padding:80px 20px;
    color:var(--muted);
    grid-column: 1 / -1;
  }
  .empty-state-icon {
    width:48px; height:48px; margin:0 auto 16px;
    border-radius:12px; background:var(--surface2);
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .empty-state h3 {
    font-family:'Bebas Neue',sans-serif;
    font-size:24px; letter-spacing:.06em; color:var(--muted2);
    margin-bottom:6px;
  }
  .empty-state p { font-size:12px; color:var(--muted); }

  /* ── ADMIN MODAL ── */
  .modal-backdrop {
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open { display:flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:16px;
    padding:32px;
    width:460px; max-width:100%;
    animation:modalIn .2s ease;
  }

  @keyframes modalIn {
    from { opacity:0; transform:scale(.96) translateY(10px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }

  .modal-title {
    font-family:'Bebas Neue',sans-serif;
    font-size:26px; letter-spacing:.06em; color:#fff;
    margin-bottom:4px;
  }

  .modal-sub {
    font-size:12px; color:var(--muted); margin-bottom:24px;
  }

  .modal-section-label {
    font-size:10px; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .modal-section-label::after {
    content:''; flex:1; height:1px; background:var(--border);
  }

  .modal-divider {
    border:none; border-top:1px solid var(--border);
    margin:22px 0;
  }

  .modal-row { display:flex; gap:8px; align-items:stretch; }
  .modal-row .modal-input { flex:1; margin-bottom:0; }

  .modal-input {
    width:100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius:8px; padding:11px 14px;
    color: var(--text);
    font-family:'Inter',sans-serif; font-size:13px;
    outline:none; transition:border-color .2s;
    margin-bottom:14px;
    /* prevent iOS zoom */
    font-size: max(13px, 16px);
  }
  .modal-input:focus { border-color:rgba(232,0,29,.4); }

  .modal-actions { display:flex; gap:10px; }

  .btn-danger {
    flex:1; background:var(--red); border:none; border-radius:8px;
    padding:11px 18px; color:#fff;
    font-family:'Inter',sans-serif; font-size:12px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase;
    cursor:pointer; transition:opacity .2s; min-height:42px;
  }
  .btn-danger:hover { opacity:.85; }
  .btn-danger:disabled { opacity:.4; cursor:not-allowed; }

  .btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius:8px; padding:0 16px;
    color: var(--text);
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
    cursor:pointer; transition:border-color .2s, color .2s;
    white-space:nowrap; min-height:42px;
  }
  .btn-secondary:hover { border-color:rgba(232,0,29,.4); color:#fff; }
  .btn-secondary:disabled { opacity:.4; cursor:not-allowed; }

  .btn-cancel {
    background:none; border:1px solid var(--border); border-radius:8px;
    padding:11px 18px; color:var(--muted);
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
    cursor:pointer; transition:border-color .2s, color .2s; min-height:42px;
  }
  .btn-cancel:hover { border-color:rgba(255,255,255,.25); color:var(--text); }

  .modal-msg {
    font-size:12px; margin-top:10px; text-align:center; min-height:16px;
  }
  .modal-msg.success { color:var(--green); }
  .modal-msg.error   { color:var(--red); }

  /* ── EDIT PANEL ── */
  .edit-backdrop {
    position:fixed; inset:0; z-index:300;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .edit-backdrop.open { display:flex; }

  .edit-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:16px; padding:28px;
    width:520px; max-width:100%;
    max-height:90vh; overflow-y:auto;
    animation:modalIn .2s ease;
  }

  .edit-panel-header {
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:20px;
  }

  .edit-panel-title {
    font-family:'Bebas Neue',sans-serif;
    font-size:24px; letter-spacing:.06em; color:#fff; line-height:1;
  }

  .edit-panel-sub {
    font-size:11px; color:var(--muted); margin-top:4px;
  }

  .edit-close {
    background:none; border:none; color:var(--muted);
    cursor:pointer; padding:4px; line-height:1;
    transition:color .2s;
  }
  .edit-close:hover { color:var(--text); }

  .edit-stat-grid {
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px; margin-bottom:18px;
  }

  .edit-stat-field { display:flex; flex-direction:column; gap:5px; }

  .edit-stat-label {
    font-size:10px; font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);
  }

  .edit-stat-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius:6px; padding:9px 10px;
    color: var(--text);
    font-family:'Inter',sans-serif;
    outline:none; transition:border-color .2s;
    width:100%;
    font-size: max(13px, 16px);
  }
  .edit-stat-input:focus { border-color:rgba(232,0,29,.4); }

  .edit-actions { display:flex; gap:10px; margin-top:4px; }

  /* ── TOAST ── */
  #toasts {
    position:fixed; bottom:20px; right:16px;
    display:flex; flex-direction:column-reverse; gap:8px;
    z-index:9999; pointer-events:none;
    max-width: min(300px, calc(100vw - 32px));
  }
  .toast {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius:8px; padding:10px 14px;
    font-size:13px; color:#fff;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    pointer-events:all;
    animation:toastIn .22s ease;
  }
  .toast.green { border-left-color:var(--green); }
  .toast.amber { border-left-color:var(--amber); }
  .toast.out   { animation:toastOut .22s ease forwards; }
  @keyframes toastIn  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(-5px)} }

  /* ── MOBILE ── */
  @media (max-width:900px) {
    .lb-grid { grid-template-columns:1fr; }
    .player-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .hero { padding:18px 0 16px; }
    .search-wrap { width:100%; }
  }

  @media (max-width:640px) {
    .hero { flex-direction:column; gap:12px; }
    .hero-title { font-size:24px; }
    .search-wrap { width:100%; }
    .lb-col-headers,
    .lb-row { grid-template-columns: 22px 1fr 38px 58px; }
    .player-grid { grid-template-columns:1fr; }
    .modal { padding:22px 18px; }
    .modal-actions { flex-direction:column-reverse; }
    .modal-row { flex-direction:column; }
    .modal-row .modal-input { margin-bottom:8px; }
    .btn-danger, .btn-cancel, .btn-secondary { width:100%; min-height:48px; }
    .edit-stat-grid { grid-template-columns:repeat(2,1fr); }
    .edit-actions { flex-direction:column-reverse; }
  }

  @media (max-width:380px) {
    .hero-title { font-size:21px; }
    .lb-table-title { font-size:14px; }
  }

  /* ── DIRECTORY ── */
  .directory-section { margin-bottom: 36px; }

  .directory-section-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }

  .directory-section-icon {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--red-dim);
    border: 1px solid rgba(232,0,29,.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .directory-section-icon.coach-icon {
    background: var(--blue-dim);
    border-color: rgba(96,165,250,.2);
  }

  .directory-section-meta { flex: 1; }

  .directory-section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: .06em; color: #fff;
    line-height: 1;
  }

  .directory-section-count {
    font-size: 10px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    margin-top: 3px;
  }

  .directory-divider {
    flex: 1; height: 1px; background: var(--border);
  }

  .directory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }

  .directory-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    transition: border-color .18s, background .18s;
    position: relative; overflow: hidden;
  }

  .directory-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--red);
    opacity: 0;
    transition: opacity .18s;
  }
  .directory-card.coach-card::before { background: var(--blue); }

  .directory-card:hover {
    border-color: rgba(232,0,29,.3);
    background: rgba(232,0,29,.03);
  }
  .directory-card:hover::before { opacity: 1; }
  .directory-card.coach-card:hover {
    border-color: rgba(96,165,250,.3);
    background: rgba(96,165,250,.03);
  }

  .directory-avatar {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px; letter-spacing: .04em;
    flex-shrink: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--red);
  }
  .directory-card.coach-card .directory-avatar { color: var(--blue); }

  .directory-info { flex: 1; min-width: 0; }

  .directory-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.2;
  }

  .directory-role {
    font-size: 10px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; margin-top: 3px;
  }
  .directory-role.owner { color: var(--red); }
  .directory-role.coach { color: var(--blue); }

  .directory-badge {
    font-size: 9px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; padding: 2px 6px;
    border-radius: 4px; flex-shrink: 0;
  }
  .directory-badge.owner-badge {
    background: var(--red-dim);
    border: 1px solid rgba(232,0,29,.2);
    color: var(--red);
  }
  .directory-badge.coach-badge {
    background: var(--blue-dim);
    border: 1px solid rgba(96,165,250,.2);
    color: var(--blue);
  }

  @media (max-width: 640px) {
    .directory-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .directory-card { padding: 11px 12px; gap: 10px; }
    .directory-avatar { width: 30px; height: 30px; font-size: 13px; }
  }

  @media (hover:none) and (pointer:coarse) {
    .lb-row:hover { background:transparent; }
    .lb-row.top:hover { background:rgba(232,0,29,.05); }
    .lb-row:active { background:rgba(255,255,255,.04); }
    .player-card:hover { border-color:var(--border); }
    .player-card:active { border-color:rgba(232,0,29,.25); }
  }
</style>
</head>
<body>

<div id="toasts"></div>

<script>
const POLL_INTERVAL_MS = 30_000;
let allPlayers = [];
let searchQuery = '';
let lastUpdatedAt = null;

const LEADERBOARDS = [
  { title:'Points Per Game',       stat:'PPG',  key:'PPG',  pct:false, asc:false },
  { title:'Assists Per Game',      stat:'APG',  key:'APG',  pct:false, asc:false },
  { title:'Rebounds Per Game',     stat:'RPG',  key:'RPG',  pct:false, asc:false },
  { title:'Steals Per Game',       stat:'SPG',  key:'SPG',  pct:false, asc:false },
  { title:'Blocks Per Game',       stat:'BPG',  key:'BPG',  pct:false, asc:false },
  { title:'Turnovers Per Game',    stat:'TOPG', key:'TOPG', pct:false, asc:true  },
  { title:'Field Goal Percentage', stat:'FG%',  key:'FG',   pct:true,  asc:false },
  { title:'3-Point Percentage',    stat:'3PT%', key:'3PT',  pct:true,  asc:false },
  { title:'Free Throw Percentage', stat:'FT%',  key:'FT',   pct:true,  asc:false },
];

const RANK_COLORS = ['gold','silver','bronze','','','','','','',''];

const STAT_FIELDS = [
  { key:'GP',   label:'GP'   },
  { key:'PPG',  label:'PPG'  },
  { key:'APG',  label:'APG'  },
  { key:'RPG',  label:'RPG'  },
  { key:'SPG',  label:'SPG'  },
  { key:'BPG',  label:'BPG'  },
  { key:'TOPG', label:'TOPG' },
  { key:'FTPG', label:'FTPG' },
  { key:'FG',   label:'FG%'  },
  { key:'FT',   label:'FT%'  },
  { key:'3PT',  label:'3PT%' },
  { key:'2PT',  label:'2PT%' },
];

function fmt(val, pct) {
  const n = parseFloat(val) || 0;
  const s = n % 1 === 0 ? n.toString() : n.toFixed(1);
  return pct ? s + '%' : s;
}

function timeAgo(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

function toast(msg, c='red', dur=5000) {
  const t = Object.assign(document.createElement('div'),{className:`toast ${c}`,textContent:msg});
  document.getElementById('toasts').prepend(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),240); }, dur);
}

function setLive(v) {
  const p=document.getElementById('live-pill'), l=document.getElementById('live-label');
  p.classList.toggle('live',v); l.textContent=v?'Live':'Offline';
}
function setSync(iso) {
  document.getElementById('last-sync').textContent = iso ? `Synced ${timeAgo(iso)}` : '';
}

async function fetchData() {
  try {
    const res = await fetch('/api/averages', { cache:'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    allPlayers = json.players || [];
    lastUpdatedAt = json.updatedAt;
    setLive(true);
    setSync(lastUpdatedAt || new Date().toISOString());
    render();
  } catch(e) {
    console.error('Fetch error:', e);
    setLive(false);
    if (!allPlayers.length) render();
  }
}

function render() {
  buildLeaderboards();
  buildPlayerCards();
  buildDirectory();
}

/* ── LEADERBOARDS ── */
function buildLeaderboards() {
  const grid = document.getElementById('lb-grid');
  const q = searchQuery.toLowerCase();
  const players = allPlayers;

  if (!players.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="9" stroke="#56566a" stroke-width="1.4"/>
          <line x1="11" y1="7" x2="11" y2="11" stroke="#56566a" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="11" cy="14.5" r=".8" fill="#56566a"/>
        </svg>
      </div>
      <h3>No Data Yet</h3>
      <p>Stats will appear after the first game is committed from Roblox.</p>
    </div>`;
    return;
  }

  grid.innerHTML = LEADERBOARDS.map(lb => {
    const sorted = [...players]
      .filter(p => p.stats && p.stats.GP > 0)
      .sort((a,b) => {
        const av = a.stats[lb.key] ?? 0, bv = b.stats[lb.key] ?? 0;
        return lb.asc ? av - bv : bv - av;
      })
      .slice(0, 10);

    if (!sorted.length) return '';

    const rows = sorted.map((p,i) => {
      const match = q && p.username.toLowerCase().includes(q);
      return `<div class="lb-row ${i===0?'top':''}">
        <span class="lb-rank ${RANK_COLORS[i]||''}">${i+1}</span>
        <span class="lb-name ${match?'search-match':''}">${p.username}</span>
        <span class="lb-gp">${p.stats.GP}</span>
        <span class="lb-val">${fmt(p.stats[lb.key], lb.pct)}</span>
      </div>`;
    }).join('');

    return `<div class="lb-table">
      <div class="lb-table-header">
        <div class="lb-table-title-wrap">
          <div class="lb-strip"></div>
          <span class="lb-table-title">${lb.title}</span>
        </div>
        <span class="lb-table-stat">${lb.stat}</span>
      </div>
      <div class="lb-col-headers">
        <span>#</span><span>Player</span><span>GP</span><span style="text-align:center">${lb.stat}</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
}

/* ── PLAYER CARDS ── */
function buildPlayerCards() {
  const grid = document.getElementById('player-grid');
  const q = searchQuery.toLowerCase();

  let players = allPlayers.filter(p => p.stats && p.stats.GP > 0);
  if (q) players = players.filter(p => p.username.toLowerCase().includes(q));
  players.sort((a,b) => (b.stats.PPG??0)-(a.stats.PPG??0));

  const STATS = [
    { label:'PPG', key:'PPG', pct:false },
    { label:'APG', key:'APG', pct:false },
    { label:'RPG', key:'RPG', pct:false },
    { label:'SPG', key:'SPG', pct:false },
    { label:'BPG', key:'BPG', pct:false },
    { label:'TOPG',key:'TOPG',pct:false },
    { label:'FG%', key:'FG',  pct:true  },
    { label:'3PT%',key:'3PT', pct:true  },
    { label:'FT%', key:'FT',  pct:true  },
  ];

  if (!players.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="9" stroke="#56566a" stroke-width="1.4"/>
          <line x1="11" y1="7" x2="11" y2="11" stroke="#56566a" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="11" cy="14.5" r=".8" fill="#56566a"/>
        </svg>
      </div>
      <h3>${q?'No Results':'No Data Yet'}</h3>
      <p>${q?`No players matching "${q}"`:'Stats will appear after the first game.'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = players.map(p => {
    const cells = STATS.map(s => `
      <div class="player-stat-cell">
        <div class="player-stat-label">${s.label}</div>
        <div class="player-stat-val">${fmt(p.stats[s.key], s.pct)}</div>
      </div>`).join('');

    return `<div class="player-card">
      <div class="player-card-header">
        <span class="player-card-name">${p.username}</span>
        <span class="player-card-gp">${p.stats.GP} GP</span>
      </div>
      <div class="player-stat-grid">${cells}</div>
    </div>`;
  }).join('');
}

/* ── LEAGUE DIRECTORY ── */
const FRANCHISE_OWNERS = [
  'Maseeh_XO',
  'YoSoy_Gelo',
  'vRqiN',
  'YNGBrandonn',
  'Beesechurger99',
  'CJ_Smoke',
  'BackyardSam',
  'SuperiorSol',
  'iNotBirdman',
  'Deshlocc',
  'xKrazyKev',
  'Dripset_Ballin',
];

const TEAM_COACHES = [
  'CoachSlick',
  'SilentHoops',
  'TacticianJ',
  'CourtVision',
  'BenchBoss',
  'PlaycallerK',
];

function getInitials(name) {
  const clean = name.replace(/[^a-zA-Z]/g, '');
  return clean.slice(0, 2).toUpperCase() || '??';
}

function buildDirectoryCard(name, type) {
  const isCoach = type === 'coach';
  const initials = getInitials(name);
  return `<div class="directory-card ${isCoach ? 'coach-card' : ''}">
    <div class="directory-avatar">${initials}</div>
    <div class="directory-info">
      <div class="directory-name">${name}</div>
      <div class="directory-role ${isCoach ? 'coach' : 'owner'}">${isCoach ? 'Head Coach' : 'Franchise Owner'}</div>
    </div>
    <span class="directory-badge ${isCoach ? 'coach-badge' : 'owner-badge'}">${isCoach ? 'HC' : 'FO'}</span>
  </div>`;
}

function buildDirectory() {
  const q = searchQuery.toLowerCase();

  const owners = q
    ? FRANCHISE_OWNERS.filter(n => n.toLowerCase().includes(q))
    : FRANCHISE_OWNERS;
  const coaches = q
    ? TEAM_COACHES.filter(n => n.toLowerCase().includes(q))
    : TEAM_COACHES;

  const ownersGrid = document.getElementById('dir-owners-grid');
  const coachesGrid = document.getElementById('dir-coaches-grid');
  const ownersCount = document.getElementById('dir-owners-count');
  const coachesCount = document.getElementById('dir-coaches-count');

  ownersCount.textContent = `${owners.length} member${owners.length !== 1 ? 's' : ''}`;
  coachesCount.textContent = `${coaches.length} member${coaches.length !== 1 ? 's' : ''}`;

  ownersGrid.innerHTML = owners.length
    ? owners.map(n => buildDirectoryCard(n, 'owner')).join('')
    : `<div class="empty-state" style="padding:32px 20px">
        <h3 style="font-size:18px">No Results</h3>
        <p>No franchise owners matching &ldquo;${q}&rdquo;</p>
       </div>`;

  coachesGrid.innerHTML = coaches.length
    ? coaches.map(n => buildDirectoryCard(n, 'coach')).join('')
    : `<div class="empty-state" style="padding:32px 20px">
        <h3 style="font-size:18px">No Results</h3>
        <p>No coaches matching &ldquo;${q}&rdquo;</p>
       </div>`;
}

/* ── TABS ── */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'directory') buildDirectory();
  });
});

/* ── SEARCH ── */
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

/* ── ADMIN MODAL ── */
const backdrop = document.getElementById('modal-backdrop');
const passInput = document.getElementById('admin-pass');
const msgEl = document.getElementById('modal-msg');
const resetBtn = document.getElementById('modal-reset');
const removeBtn = document.getElementById('modal-remove');
const removeUsernameInput = document.getElementById('remove-username');
const editLoadBtn = document.getElementById('modal-edit-load');
const editUsernameInput = document.getElementById('edit-username-search');

function showMsg(text, type) {
  msgEl.textContent = text;
  msgEl.className = `modal-msg ${type}`;
}

document.getElementById('admin-btn').addEventListener('click', () => {
  backdrop.classList.add('open');
  passInput.value = ''; removeUsernameInput.value = ''; editUsernameInput.value = '';
  msgEl.textContent = ''; msgEl.className = 'modal-msg';
  setTimeout(() => passInput.focus(), 50);
});

document.getElementById('modal-cancel').addEventListener('click', () => backdrop.classList.remove('open'));
backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.classList.remove('open'); });
passInput.addEventListener('keydown', e => { if (e.key === 'Enter') editUsernameInput.focus(); });

/* ── EDIT PLAYER ── */
const editBackdrop = document.getElementById('edit-backdrop');
const editMsgEl = document.getElementById('edit-msg');
const editSaveBtn = document.getElementById('edit-save');
const editStatGrid = document.getElementById('edit-stat-grid');
let editingUsername = null;

function openEditPanel(player) {
  editingUsername = player.username;
  document.getElementById('edit-panel-title').textContent = `Edit — ${player.username}`;
  editStatGrid.innerHTML = STAT_FIELDS.map(f => `
    <div class="edit-stat-field">
      <label class="edit-stat-label" for="es-${f.key}">${f.label}</label>
      <input class="edit-stat-input" id="es-${f.key}" type="number" step="any" min="0"
             value="${player.stats[f.key] ?? 0}" data-key="${f.key}">
    </div>`).join('');
  editMsgEl.textContent = ''; editMsgEl.className = 'modal-msg';
  editBackdrop.classList.add('open');
  setTimeout(() => editStatGrid.querySelector('.edit-stat-input')?.focus(), 50);
}

editUsernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') editLoadBtn.click(); });

editLoadBtn.addEventListener('click', () => {
  const pass = passInput.value.trim(), username = editUsernameInput.value.trim();
  if (!pass)     { showMsg('Enter your password first.', 'error'); return; }
  if (!username) { showMsg('Enter a username to edit.', 'error'); return; }
  const player = allPlayers.find(p => p.username.toLowerCase() === username.toLowerCase());
  if (!player)   { showMsg(`Player "${username}" not found.`, 'error'); return; }
  showMsg('', '');
  openEditPanel(player);
});

function closeEditPanel() { editBackdrop.classList.remove('open'); editingUsername = null; }
document.getElementById('edit-close').addEventListener('click', closeEditPanel);
document.getElementById('edit-cancel').addEventListener('click', closeEditPanel);
editBackdrop.addEventListener('click', e => { if (e.target === editBackdrop) closeEditPanel(); });

editSaveBtn.addEventListener('click', async () => {
  const pass = passInput.value.trim();
  if (!pass) { editMsgEl.textContent = 'Password missing.'; editMsgEl.className = 'modal-msg error'; return; }

  const stats = {};
  editStatGrid.querySelectorAll('.edit-stat-input').forEach(inp => {
    stats[inp.dataset.key] = parseFloat(inp.value) || 0;
  });

  editSaveBtn.disabled = true; editSaveBtn.textContent = 'Saving…';
  editMsgEl.textContent = ''; editMsgEl.className = 'modal-msg';

  try {
    const res = await fetch('/api/edit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password:pass, username:editingUsername, stats })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error||'Failed');

    const idx = allPlayers.findIndex(p => p.username === json.player.username);
    if (idx !== -1) allPlayers[idx] = json.player;
    render();
    toast(`${json.player.username} updated`, 'green', 4000);
    editMsgEl.textContent = `✓ ${json.player.username} updated successfully.`;
    editMsgEl.className = 'modal-msg success';
    setTimeout(closeEditPanel, 1400);
  } catch(e) {
    editMsgEl.textContent = e.message || 'Save failed.';
    editMsgEl.className = 'modal-msg error';
  } finally {
    editSaveBtn.disabled = false; editSaveBtn.textContent = 'Save Changes';
  }
});

/* ── REMOVE ── */
removeUsernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') removeBtn.click(); });
removeBtn.addEventListener('click', async () => {
  const pass = passInput.value.trim(), username = removeUsernameInput.value.trim();
  if (!pass)     { showMsg('Enter your password.', 'error'); return; }
  if (!username) { showMsg('Enter a username to remove.', 'error'); return; }

  removeBtn.disabled = true; removeBtn.textContent = 'Removing…';
  msgEl.textContent = ''; msgEl.className = 'modal-msg';

  try {
    const res = await fetch('/api/remove', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password:pass, username })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error||'Failed');
    showMsg(`✓ "${json.deleted}" removed.`, 'success');
    allPlayers = allPlayers.filter(p => p.username.toLowerCase() !== json.deleted.toLowerCase());
    removeUsernameInput.value = '';
    render();
    toast(`${json.deleted} removed`, 'amber', 4000);
  } catch(e) {
    showMsg(e.message || 'Incorrect password or player not found.', 'error');
  } finally {
    removeBtn.disabled = false; removeBtn.textContent = 'Remove';
  }
});

/* ── RESET ── */
resetBtn.addEventListener('click', async () => {
  const pass = passInput.value.trim();
  if (!pass) { showMsg('Enter your password.', 'error'); return; }

  resetBtn.disabled = true; resetBtn.textContent = 'Resetting…';
  msgEl.textContent = ''; msgEl.className = 'modal-msg';

  try {
    const res = await fetch('/api/reset', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password:pass })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error||'Failed');
    showMsg(`✓ Reset complete. ${json.deleted} player records deleted.`, 'success');
    allPlayers = []; render();
    setTimeout(() => backdrop.classList.remove('open'), 2000);
  } catch(e) {
    showMsg('Incorrect password or server error.', 'error');
  } finally {
    resetBtn.disabled = false; resetBtn.textContent = 'Reset All Stats';
  }
});

/* ── INIT ── */
fetchData();
setInterval(() => {
  fetchData();
  if (lastUpdatedAt) setSync(lastUpdatedAt);
}, POLL_INTERVAL_MS);
</script>
</body>
</html>
